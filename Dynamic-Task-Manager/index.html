
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Task Manager</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Check login before opening dashboard -->
    <script>
        if (sessionStorage.getItem("taskManagerLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Page Header -->
        <header>

            <h1>My Task Manager ♡</h1>

            <p>Organize your day, achieve your goals!</p>

            <button type="button" id="logoutButton">
                Logout
            </button>

        </header>


        <!-- Dashboard Section -->
        <section class="dashboard">

            <!-- Total Tasks -->
            <div class="stat-card">

                <h3>Total Tasks</h3>

                <p id="totalTasks">0</p>

            </div>


            <!-- Active Tasks -->
            <div class="stat-card">

                <h3>Active Tasks</h3>

                <p id="activeTasks">0</p>

            </div>


            <!-- Completed Tasks -->
            <div class="stat-card">

                <h3>Completed Tasks</h3>

                <p id="completedTasks">0</p>

            </div>

        </section>


        <!-- Add New Task Section -->
        <section class="add-task">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <!-- Task Name -->
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    required
                >

                <!-- Select Category -->
                <select id="taskCategory">

                    <option value="Work">Work</option>

                    <option value="Personal">Personal</option>

                    <option value="Study">Study</option>

                </select>

                <!-- Select Due Date -->
                <input
                    type="date"
                    id="taskDate"
                >

                <!-- Add Button -->
                <button type="submit">
                    + Add Task
                </button>

            </form>

        </section>


        <!-- Search Tasks -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search your tasks..."
            >

        </section>


        <!-- Category Filter -->
        <section class="category-section">

            <select id="categoryFilter">

                <option value="all">All Categories</option>

                <option value="Work">Work</option>

                <option value="Personal">Personal</option>

                <option value="Study">Study</option>

            </select>

        </section>


        <!-- Task Status Filters -->
        <section class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
                type="button"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active"
                type="button"
            >
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
                type="button"
            >
                Completed
            </button>

        </section>


        <!-- My Tasks Section -->
        <section class="task-section">

            <h2>My Tasks</h2>

            <!-- Tasks will be displayed here -->
            <div id="taskList">

                <p id="emptyMessage">
                    No tasks yet. Add your first task!
                </p>

            </div>

        </section>


    </div>


    <!-- Connect JavaScript File -->
    <script src="script.js"></script>


    <!-- Logout Function -->
    <script>

        const logoutButton = document.getElementById("logoutButton");

        logoutButton.addEventListener("click", function() {

            sessionStorage.removeItem("taskManagerLoggedIn");

            sessionStorage.removeItem("taskManagerEmail");

            window.location.href = "login.html";

        });

    </script>

</body>
</html>
